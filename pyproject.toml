[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "pygrid"
version = "0.1.0"
description = "Python corner point grid generator for Eclipse style reservoir models"
authors = [
    {name="g-zi"}
]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy"
]


[tool.setuptools.packages.find]
where = ["src"]